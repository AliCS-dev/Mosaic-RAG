services:
  api:
    build: ./api
    container_name: mosaic_api
    ports:
      - "8000:8000"
    depends_on:
      - retriever
      - generator

  retriever:
    build: ./retriever
    container_name: mosaic_retriever
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data

  generator:
    build: ./generator
    container_name: mosaic_generator
    ports:
      - "8002:8002"