name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  docker-compose-build:
    name: Build and test Docker services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build

      - name: Start Docker Compose services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Test API Controller health endpoint
        run: curl --fail http://localhost:8000/

      - name: Test Retriever health endpoint
        run: curl --fail http://localhost:8001/

      - name: Test Generator health endpoint
        run: curl --fail http://localhost:8002/

      - name: Test full API pipeline
        run: |
          curl --fail -X POST http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"query": "what does docker do in rag?", "top_k": 3}'

      - name: Stop services
        if: always()
        run: docker compose down